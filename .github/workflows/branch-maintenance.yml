name: Branch maintenance

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report candidates without deleting branches'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/maintenance/**'
      - '.github/workflows/branch-maintenance.yml'

permissions:
  contents: read

concurrency:
  group: branch-maintenance-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/maintenance -p 'test_*.py' -v

  expire:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Expire merged inactive branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPLY: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python .github/maintenance/maintenance.py --repo "$REPOSITORY" "${args[@]}"
      - name: Retain sanitized audit report for the Windows notes publisher
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-maintenance-report
          path: branch-maintenance-report.json
          retention-days: 90
          if-no-files-found: warn
